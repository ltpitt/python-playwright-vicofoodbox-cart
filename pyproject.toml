[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vicocart"
version = "0.1.0"
description = "Fill the vicofoodbox.com shopping cart from a TOML shopping list."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.60",
    "playwright>=1.49",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
vicocart = "vicocart.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
